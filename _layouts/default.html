<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="https://andrewlehmann.ca{{ page.url | replace: 'index.html', '' }}">

  <meta name="robots" content="index, follow">

  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="https://andrewlehmann.ca{{ page.url | replace: 'index.html', '' }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Andrew Lehmann">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "mainEntity": {
      "@type": "Person",
      "name": "Andrew Lehmann",
      "alternateName": "Andrew Joseph Lehmann",
      "url": "https://andrewlehmann.ca/",
      "affiliation": {
        "@type": "CollegeOrUniversity",
        "name": "University of Toronto"
      },
      "sameAs": [
        "https://github.com/andrewjosephlehmann",
        "https://www.physics.utoronto.ca/members/lehmann-andrew/"
      ],
      "knowsAbout": [
        "Physics",
        "Optics",
        "Quantum optics",
        "Holography",
        "Optomechanics",
        "Mechatronics"
      ]
    }
  }
  </script>

  <link rel="stylesheet" href="/css/screen.css">
  <link rel="stylesheet" href="/css/syntax.css">
</head>

<body>
  <header>
    <a href="/">Andrew Lehmann</a>
    <a href="/">home</a>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <a href="https://www.physics.utoronto.ca/members/lehmann-andrew/">Department profile</a>
  </footer>
</body>
</html>
